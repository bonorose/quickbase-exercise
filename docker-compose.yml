services:
  db:
    image: postgres:17-alpine
    container_name: qai-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qai-network
    restart: unless-stopped

  backend:
    build: ./services/backend
    container_name: qai-backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_FAKE_SCRIPT_PATH: ${LLM_FAKE_SCRIPT_PATH:-tests/fixtures/llm_scripts/read_path.yaml}
    volumes:
      - ./services/backend:/app
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m src.seed && uvicorn src.main:app --reload --host 0.0.0.0 --port 5000"
    networks:
      - qai-network
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      target: dev
    container_name: qai-frontend
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:5000}
      NUXT_PUBLIC_API_PREFIX: ${API_V1_PREFIX:-/api/v1}
      NUXT_WATCH_POLLING: "true"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - qai-network
    restart: unless-stopped

volumes:
  db-data:

networks:
  qai-network:
    driver: bridge
