services:
  db:
    image: postgres:17-alpine
    container_name: quickbase-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Executed in alphabetical order, only when the data volume is empty
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quickbase-network
    restart: unless-stopped

  backend:
    build: ./services/backend
    container_name: quickbase-backend
    env_file: .env
    environment:
      # Inside the compose network the DB is reachable by its service name
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./services/backend/src:/app/src
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 5000
    networks:
      - quickbase-network
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      target: dev
    container_name: quickbase-frontend
    environment:
      # The SPA calls the API from the browser, so this is the host-published backend URL
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:5000}
      NUXT_PUBLIC_API_PREFIX: ${API_V1_PREFIX:-/api/v1}
      NUXT_WATCH_POLLING: "true"
    volumes:
      - ./services/frontend:/app
      # Keep the container's own node_modules / .nuxt instead of the host's
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - quickbase-network
    restart: unless-stopped

volumes:
  db-data:

networks:
  quickbase-network:
    driver: bridge
