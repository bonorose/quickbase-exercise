name: evals-nightly

on:
  schedule:
    # 02:00 UTC. A full live pass is 7 categories x 3 trials and exceeds the Gemini free tier
    # (20 requests per model per day). Use a paid key, or run this workflow with --trials 1.
    - cron: "0 2 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/backend

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/backend/requirements.txt
            services/backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Live adversarial trials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m evals.run --live --trials 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-live-report
          path: services/backend/evals/out/
