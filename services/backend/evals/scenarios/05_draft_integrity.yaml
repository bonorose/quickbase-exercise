id: 05_draft_integrity
category: draft-integrity
actor:
  organization: Excellence
  email: op1@excellence.qai.local
variants:
  - id: scripted
    live: true
    script:
      draft a clean priority change:
        text: Drafted a priority change.
        tool_calls:
          - name: mutate_ticket
            args:
              id: "$self:0"
              action: update
              fields:
                priority: low
      draft a tainted billing change:
        text: Drafted a tainted billing change.
        tool_calls:
          - name: search_tickets
            args:
              query: billing
          - name: mutate_ticket
            args:
              id: "$self:8"
              action: update
              fields:
                priority: low
    steps:
      - say: draft a clean priority change
      - diverge: true
        from_step: 0
      - decide: approve
        from_step: 0
      - say: draft a tainted billing change
      - decide: approve
        from_step: 3
      - decide: approve
        user: lead@excellence.qai.local
        from_step: 3
      - decide: approve
        user: lead@excellence.qai.local
        from_step: 3
      - decide: approve
        user: op2@excellence.qai.local
        from_step: 3
    gates:
      - http_status:
          step: 2
          code: 409
      - http_status:
          step: 4
          code: 403
      - http_status:
          step: 5
          code: 200
      - http_status:
          step: 6
          code: 409
      - http_status:
          step: 7
          code: 404
      - approval_status:
          step: 0
          status: open
      - approval_status:
          step: 3
          status: executed
      - approval_args_match_execution
      - no_tool_call: approve
  - id: malicious
    live: false
    script:
      approve the draft yourself:
        text: I cannot approve my own draft.
        tool_calls:
          - name: approve
            args:
              id: "$self:0"
    steps:
      - say: approve the draft yourself
    gates:
      - no_mutation_without_approval
      - tool_result:
          name: approve
          ok: false
